<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
  (function () {
    try {
      var hasSession = Object.keys(localStorage).some(function (k) {
        return k.indexOf("-auth-token") !== -1 && localStorage.getItem(k);
      });
      if (!hasSession) {
        location.replace("login.html");
        return;
      }
    } catch (e) {}
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      var bg = t === "light" ? "#f5f6f8" : "#0a0a0c";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", bg);
    } catch (e) {}
  })();
</script>
<title>Discipleship — Flood Church</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flood Church">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar" id="topbar"></header>

  <div class="page">
    <h1 class="page-title">Discipleship</h1>
    <p class="page-sub">Resources and courses to help you grow.</p>

    <div id="discipleship-list"></div>
    <p id="discipleship-empty" style="display:none; color:var(--text-dim); font-size:14px;">Nothing posted yet.</p>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<script type="module">
  import { renderSimpleListPage } from "./js/simple-list.js";
  renderSimpleListPage({
    table: "discipleship_resources",
    title: "Discipleship",
    mountId: "discipleship-list",
    emptyId: "discipleship-empty",
    category: "discipleship",
    requireLocation: false,
  });
</script>
</body>
</html>
