<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Changing page can cross-fade (see css/style.css). If the browser has to cancel a fade (for example right after an
  // update, while an older copy of a page is still being replaced) it reports a harmless "transition aborted" error.
  // Handling it here keeps the console clean; nothing else changes.
  (function () {
    function quiet(e) {
      var t = e.viewTransition;
      if (!t) return;
      ["ready", "finished", "updateCallbackDone"].forEach(function (k) {
        if (t[k] && t[k].catch) t[k].catch(function () {});
      });
    }
    addEventListener("pagereveal", quiet);
    addEventListener("pageswap", quiet);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot password — Flood Church</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-note { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; margin: 0 0 16px; font-size: 14px; line-height: 1.55; color: var(--text); }
  .auth-note b { color: var(--text); }
  .auth-note[hidden], .auth-error[hidden] { display: none; }
  .auth-forgot { display: block; text-align: right; margin: -4px 0 14px; font-size: 13.5px; }
  .auth-show { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-dim); margin: 0 0 16px; cursor: pointer; }
  .auth-linkbtn { display: block; text-align: center; text-decoration: none; }
</style>
</head>
<body>
<div class="app">
  <div class="auth-page">
    <div class="auth-brand">
      <div class="mark"><img src="assets/floodwhite.svg" alt="Flood Church logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'F'}))"></div>
      <div class="word"><b>FLOOD</b><span>CHURCH</span></div>
    </div>

    <h1>Forgot your password?</h1>
    <p class="auth-sub" id="forgot-intro">Enter the email you signed up with and we&rsquo;ll send you a link to choose a new one.</p>

    <div class="auth-error" id="auth-error"></div>
    <div class="auth-note" id="auth-note" hidden></div>

    <form id="forgot-form" novalidate>
      <div class="auth-field">
        <label for="email">Email</label>
        <input class="auth-input" type="email" id="email" required autocomplete="email" inputmode="email">
      </div>
      <button class="btn btn-primary auth-submit" type="submit" id="submit-btn">Send reset link</button>
    </form>

    <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
  </div>
</div>

<script type="module">
  import { applyTheme } from "./js/theme.js";
  import { renderForgotPassword } from "./js/components/auth-recovery.js";
  applyTheme();
  renderForgotPassword();
</script>
</body>
</html>
