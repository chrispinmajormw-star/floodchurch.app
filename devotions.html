<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Changing page can cross-fade (see css/style.css). If the browser has to cancel a fade (for example right after an
  // update, while an older copy of a page is still being replaced) it reports a harmless "transition aborted" error.
  // Handling it here keeps the console clean; nothing else changes.
  (function () {
    function quiet(e) {
      var t = e.viewTransition;
      if (!t) return;
      ["ready", "finished", "updateCallbackDone"].forEach(function (k) {
        if (t[k] && t[k].catch) t[k].catch(function () {});
      });
    }
    addEventListener("pagereveal", quiet);
    addEventListener("pageswap", quiet);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      var bg = t === "light" ? "#f5f6f8" : "#0a0a0c";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", bg);
    } catch (e) {}
  })();
</script>
<title>Devotions — Flood Church</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flood Church">

</html>
