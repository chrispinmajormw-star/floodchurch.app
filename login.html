<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Changing page can cross-fade (see css/style.css). If the browser has to cancel a fade (for example right after an
  // update, while an older copy of a page is still being replaced) it reports a harmless "transition aborted" error.
  // Handling it here keeps the console clean; nothing else changes.
  (function () {
    function quiet(e) {
      var t = e.viewTransition;
      if (!t) return;
      ["ready", "finished", "updateCallbackDone"].forEach(function (k) {
        if (t[k] && t[k].catch) t[k].catch(function () {});
      });
    }
    addEventListener("pagereveal", quiet);
    addEventListener("pageswap", quiet);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign In — Flood Church</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-forgot { display: block; text-align: right; margin: -4px 0 14px; font-size: 13.5px; }
</style>
</head>
<body>
<div class="app">
  <div class="auth-page">
    <div class="auth-brand">
      <div class="mark"><img src="assets/floodwhite.svg" alt="Flood Church logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'F'}))"></div>
      <div class="word"><b>FLOOD</b><span>CHURCH</span></div>
    </div>

    <!-- Shown when someone reaches something that needs an account (login.html?next=give.html) -->
    <div class="gate" id="gate" hidden>
      <div class="gate-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
      <h1>Sign in or create an account to continue</h1>
      <p class="auth-sub" id="gate-reason"></p>
      <a class="btn btn-primary auth-submit gate-create" id="gate-create" href="signup.html">Create an account</a>
      <p class="gate-or">Already have an account? Sign in below.</p>
    </div>
    <div id="welcome-back">
      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to give, save sermons, and track your reading plans.</p>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input class="auth-input" type="email" id="email" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input class="auth-input" type="password" id="password" required autocomplete="current-password">
      </div>
      <a class="auth-forgot" href="forgot-password.html" id="forgot-link">Forgot password?</a>
      <button class="btn btn-primary auth-submit" type="submit" id="submit-btn">Sign in</button>
    </form>

    <p class="auth-switch" id="new-here">New here? <a href="signup.html" id="signup-link">Create an account</a></p>
    <p class="auth-switch"><a href="index.html" id="keep-browsing">Keep browsing without an account</a></p>
  </div>
</div>

<script type="module">
  import { signIn, afterSignInTarget, gateReason, signupUrl } from "./js/auth.js";
  import { supabase } from "./js/supabaseClient.js";
  import { applyTheme } from "./js/theme.js";
  applyTheme();

  // Where to go after signing in: the page they came from (login.html?next=give.html), or Home.
  const params = new URLSearchParams(location.search);
  const target = afterSignInTarget();

  // Someone who reached something that needs an account sees a friendly explanation and a way to create one.
  const reason = gateReason(target, params.get("why"));
  const createUrl = signupUrl({ next: target, why: params.get("why") });
  document.getElementById("signup-link").href = createUrl;
  if (reason) {
    document.getElementById("gate").hidden = false;
    document.getElementById("welcome-back").hidden = true;
    document.getElementById("new-here").hidden = true;
    document.getElementById("gate-reason").textContent = `You need a free account to ${reason}. It only takes a minute.`;
    document.getElementById("gate-create").href = createUrl;
  }

  // Already signed in? Go straight where they were headed.
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) location.href = target;
  });

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("auth-error");
  const submitBtn = document.getElementById("submit-btn");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  // "Forgot password?" carries over an email they've already typed, so they don't type it twice.
  document.getElementById("forgot-link").addEventListener("click", (e) => {
    const typed = emailInput.value.trim();
    if (typed) e.currentTarget.href = "forgot-password.html?email=" + encodeURIComponent(typed);
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";
    try {
      await signIn(emailInput.value.trim(), passwordInput.value);
      location.href = target;
    } catch (err) {
      errorBox.textContent = err.message || "Couldn't sign in. Check your details and try again.";
      errorBox.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
