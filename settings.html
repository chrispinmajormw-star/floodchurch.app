<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
  // Apply saved theme/accent immediately, before first paint, to avoid a flash of the default theme.
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      var bg = t === "light" ? "#f5f6f8" : "#0a0a0c";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", bg);
    } catch (e) {}
  })();
</script>
<title>Settings — Flood Church</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar" id="topbar"></header>

  <div class="page">
    <div class="settings-group">
      <p class="group-label">Account</p>
      <div id="account-group"></div>
    </div>

    <div class="settings-group">
      <p class="group-label">Notifications</p>
      <div id="notifications-group"></div>
    </div>

    <div class="settings-group">
      <p class="group-label">Media &amp; downloads</p>
      <div id="media-group"></div>
    </div>

    <div class="settings-group">
      <p class="group-label">Appearance</p>
      <div id="appearance-group"></div>
    </div>

    <div class="settings-group">
      <p class="group-label">Support</p>
      <div id="support-group"></div>
    </div>

    <div class="settings-group">
      <p class="group-label">Account actions</p>
      <div class="list-row" id="delete-account">
        <div class="row-body"><p class="row-title danger-row">Delete my account</p></div>
      </div>
    </div>

    <button class="logout-btn" id="logout-btn">Log out</button>
    <p class="app-version" id="app-version"></p>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<script type="module">
  import { renderSettings } from "./js/components/settings.js";
  renderSettings();
</script>
</body>
</html>
