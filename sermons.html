<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
  (function () {
    try {
      var hasSession = Object.keys(localStorage).some(function (k) {
        return k.indexOf("-auth-token") !== -1 && localStorage.getItem(k);
      });
      if (!hasSession) {
        location.replace("login.html");
        return;
      }
    } catch (e) {}
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      var bg = t === "light" ? "#f5f6f8" : "#0a0a0c";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", bg);
    } catch (e) {}
  })();
</script>
<title>Sermons — Flood Church</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flood Church">
<!-- preload:start -->
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="modulepreload" href="js/App.js">
<link rel="modulepreload" href="js/icons.js">
<link rel="modulepreload" href="js/theme.js">
<link rel="modulepreload" href="js/supabaseClient.js">
<link rel="modulepreload" href="js/notifications.js">
<link rel="modulepreload" href="js/auth.js">
<link rel="modulepreload" href="js/components/sermons.js">
<link rel="modulepreload" href="js/player.js">
<link rel="modulepreload" href="js/util.js">
<link rel="modulepreload" href="js/offline-audio.js">
<!-- preload:end -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar" id="topbar"></header>

  <div class="page">
    <h1 class="page-title">Sermons</h1>
    <div class="sermon-shortcuts" id="sermon-shortcuts"></div>

    <label class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="sermon-search" type="search" placeholder="Search sermons" autocomplete="off" aria-label="Search sermons">
    </label>

    <div class="seg-tabs" role="tablist">
      <button class="seg active" role="tab" data-tab="video" aria-selected="true">Video</button>
      <button class="seg" role="tab" data-tab="audio" aria-selected="false">Audio</button>
    </div>

    <div class="chip-scroll" id="series-chips"></div>

    <p class="list-count" id="sermon-count"></p>
    <div id="sermon-list"></div>
    <p id="sermon-empty" style="display:none; color:var(--text-dim); font-size:14px;"></p>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<script type="module">
  import { renderSermons } from "./js/components/sermons.js";
  renderSermons();
</script>
</body>
</html>
