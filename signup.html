<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Changing page can cross-fade (see css/style.css). If the browser has to cancel a fade (for example right after an
  // update, while an older copy of a page is still being replaced) it reports a harmless "transition aborted" error.
  // Handling it here keeps the console clean; nothing else changes.
  (function () {
    function quiet(e) {
      var t = e.viewTransition;
      if (!t) return;
      ["ready", "finished", "updateCallbackDone"].forEach(function (k) {
        if (t[k] && t[k].catch) t[k].catch(function () {});
      });
    }
    addEventListener("pagereveal", quiet);
    addEventListener("pageswap", quiet);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
  // Apply saved theme/accent immediately, before first paint, to avoid a flash of the default theme.
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      var bg = t === "light" ? "#f5f6f8" : "#0a0a0c";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", bg);
    } catch (e) {}
  })();
</script>
<title>Create Account — Flood Church</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="auth-page">
    <div class="auth-brand">
      <div class="mark"><img src="assets/floodwhite.svg" alt="Flood Church logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'F'}))"></div>
      <div class="word"><b>FLOOD</b><span>CHURCH</span></div>
    </div>

    <h1>Join Flood Church</h1>
    <p class="auth-sub" id="signup-sub">Create an account to get started.</p>

    <div class="auth-error" id="auth-error"></div>

    <form id="signup-form">
      <div class="auth-field">
        <label for="name">Full name</label>
        <input class="auth-input" type="text" id="name" required autocomplete="name">
      </div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input class="auth-input" type="email" id="email" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input class="auth-input" type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <button class="btn btn-primary auth-submit" type="submit" id="submit-btn">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html" id="login-link">Sign in</a></p>
    <p class="auth-switch"><a href="index.html">Keep browsing without an account</a></p>
  </div>
</div>

<script type="module">
  import { signUp, afterSignInTarget, gateReason, loginUrl } from "./js/auth.js";
  import { supabase } from "./js/supabaseClient.js";
  import { applyTheme } from "./js/theme.js";
  applyTheme();

  // Where to go once the account exists: the page they came from (signup.html?next=give.html), or Home.
  const params = new URLSearchParams(location.search);
  const target = afterSignInTarget();
  const reason = gateReason(target, params.get("why"));
  if (reason) document.getElementById("signup-sub").textContent = `Create a free account to ${reason}. It only takes a minute.`;
  document.getElementById("login-link").href = loginUrl({ next: target, why: params.get("why") });

  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) location.href = target;
  });

  const form = document.getElementById("signup-form");
  const errorBox = document.getElementById("auth-error");
  const submitBtn = document.getElementById("submit-btn");
  const nameInput = document.getElementById("name");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account…";
    try {
      const result = await signUp({
        email: emailInput.value.trim(),
        password: passwordInput.value,
        name: nameInput.value.trim(),
      });
      if (result.session) {
        // Email confirmation is off — go straight in (back to where they were).
        location.href = target;
      } else {
        // Email confirmation is required.
        errorBox.textContent = "Account created! Check your email to confirm, then sign in.";
        errorBox.style.color = "#8fd19e";
        errorBox.style.background = "rgba(80,200,120,0.1)";
        errorBox.style.borderColor = "rgba(80,200,120,0.4)";
        errorBox.classList.add("show");
        submitBtn.textContent = "Check your email";
      }
    } catch (err) {
      errorBox.textContent = err.message || "Couldn't create your account. Try again.";
      errorBox.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
