<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Account — Flood Church</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="auth-page">
    <div class="auth-brand">
      <div class="mark"><img src="assets/floodwhite.svg" alt="Flood Church logo"></div>
      <div class="word"><b>FLOOD</b><span>CHURCH</span></div>
    </div>

    <h1>Join Flood Church</h1>
    <p class="auth-sub">Create an account to get started.</p>

    <div class="auth-error" id="auth-error"></div>

    <form id="signup-form">
      <div class="auth-field">
        <label for="name">Full name</label>
        <input class="auth-input" type="text" id="name" required autocomplete="name">
      </div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input class="auth-input" type="email" id="email" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input class="auth-input" type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <button class="btn btn-primary auth-submit" type="submit" id="submit-btn">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<script type="module">
  import { signUp } from "./js/auth.js";
  import { supabase } from "./js/supabaseClient.js";
  import { applyTheme } from "./js/theme.js";
  applyTheme();

  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) location.href = "index.html";
  });

  const form = document.getElementById("signup-form");
  const errorBox = document.getElementById("auth-error");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account…";
    try {
      const result = await signUp({
        email: email.value.trim(),
        password: password.value,
        name: name.value.trim(),
      });
      if (result.session) {
        // Email confirmation is off — go straight in.
        location.href = "index.html";
      } else {
        // Email confirmation is required.
        errorBox.textContent = "Account created! Check your email to confirm, then sign in.";
        errorBox.style.color = "#8fd19e";
        errorBox.style.background = "rgba(80,200,120,0.1)";
        errorBox.style.borderColor = "rgba(80,200,120,0.4)";
        errorBox.classList.add("show");
        submitBtn.textContent = "Check your email";
      }
    } catch (err) {
      errorBox.textContent = err.message || "Couldn't create your account. Try again.";
      errorBox.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
