<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // Apply saved theme/accent immediately, before first paint, to avoid a flash of the default theme.
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
    } catch (e) {}
  })();
</script>
<title>Flood Church</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar" id="topbar"></header>

  <div class="page">
    <p class="greeting" id="greeting-text">Good evening,</p>
    <p class="greeting-name" id="user-name">&nbsp;</p>

    <div class="hero">
      <span class="live-tag"><span class="dot"></span><span id="hero-tag"></span></span>
      <h3 id="hero-headline"></h3>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="location.href='media.html'">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Watch live
        </button>
        <a class="btn btn-ghost" href="media.html">
          Media
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </a>
      </div>
    </div>

    <div class="next-service">
      <div class="label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Next service in
      </div>
      <div class="countdown" id="countdown">&mdash;</div>
      <div class="service-meta" id="service-meta"></div>
    </div>

    <div class="quick-grid" id="quick-grid"></div>

    <div class="verse-box">
      <div class="eyebrow">VERSE OF THE DAY</div>
      <p id="verse-text"></p>
    </div>

    <div class="section-head">
      <h2 class="section-title" style="margin:0;">Today's Devotion</h2>
      <a href="bible.html">View all</a>
    </div>
    <div class="devotion-card" id="devotion-card"></div>

    <div class="section-head">
      <h2 class="section-title" style="margin:0;">Recent Sermons</h2>
      <a href="media.html">View all</a>
    </div>
    <div class="sermon-grid" id="sermon-grid"></div>

    <div class="section-head">
      <h2 class="section-title" style="margin:0;">Upcoming Events</h2>
      <a href="#">Calendar</a>
    </div>
    <div id="event-list"></div>
    <div class="conference-banner" id="conference-banner"></div>

    <h2 class="section-title">Quick Giving</h2>
    <div class="quick-giving-card">
      <p id="quick-giving-text"></p>
      <button class="btn-gold" id="quick-giving-btn"></button>
    </div>

    <h2 class="section-title">Podcast</h2>
    <div class="card" style="padding: 6px 16px;" id="home-podcasts"></div>

    <h2 class="section-title">Announcements</h2>
    <div id="announcements"></div>

    <h2 class="section-title">Ministries</h2>
    <div class="chip-grid" id="home-ministries"></div>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<script type="module">
  import { renderHome } from "./js/components/home.js";
  renderHome();
</script>
</body>
</html>
