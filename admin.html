<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      var bg = t === "light" ? "#f5f6f8" : "#0a0a0c";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", bg);
    } catch (e) {}
  })();
</script>
<title>Admin — Flood Church</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" style="max-width:640px;">

  <header class="topbar" id="topbar"></header>

  <div class="page" id="admin-root">
    <h1 class="page-title">Admin</h1>
    <p class="page-sub">Post content that appears live in the app.</p>
    <div id="admin-content">Loading…</div>
  </div>

</div>

<script type="module">
  import { renderAdmin } from "./js/components/admin.js";
  renderAdmin();
</script>
</body>
</html>
