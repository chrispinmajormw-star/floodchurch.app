<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
  // Apply saved theme/accent immediately, before first paint, to avoid a flash of the default theme.
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      var bg = t === "light" ? "#f5f6f8" : "#0a0a0c";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", bg);
    } catch (e) {}
  })();
</script>
<title>Bible — Flood Church</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flood Church">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- Reader header: hamburger (book/chapter picker) · title · icons -->
  <header class="bible-header">
    <button class="icon-btn" id="picker-open" aria-label="Choose book and chapter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="bible-header-center">
      <h1 id="reader-title">Genesis 1</h1>
      <span>KJV</span>
    </div>
    <div class="bible-header-icons">
      <button class="icon-btn" id="daily-open" aria-label="Daily reading">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 0 2.5-2.5z"/></svg>
      </button>
      <button class="icon-btn" id="plans-open" aria-label="Reading plans">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg>
      </button>
      <button class="icon-btn" id="search-open" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>
  </header>

  <!-- Inline search row, hidden until the search icon is tapped -->
  <div class="search-bar" id="search-row" style="display:none; margin:14px 20px 0;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="verse-search-input" type="text" placeholder="Search a verse, e.g. John 3:16" style="background:none;border:none;color:var(--text);font-size:14px;flex:1;outline:none;">
  </div>

  <!-- Full-page reader -->
  <div class="reader-page">
    <div id="reader-status" class="reader-status"></div>
    <div id="book-banner" class="book-banner" style="display:none;"></div>
    <div id="reader-text" class="reader-text"></div>

    <div class="reader-floating-nav">
      <button class="reader-nav-btn" id="prev-chapter" aria-label="Previous chapter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="reader-nav-btn" id="next-chapter" aria-label="Next chapter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>

  <!-- Book/chapter picker modal -->
  <div class="modal-overlay" id="picker-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="section-title" style="margin:0;">Go to</h2>
        <button class="modal-close" data-close="picker-modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="bible-picker">
        <select id="book-select" class="auth-input" style="flex:2;"></select>
        <select id="chapter-select" class="auth-input" style="flex:1;"></select>
      </div>
    </div>
  </div>

  <!-- Daily reading modal -->
  <div class="modal-overlay" id="daily-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="section-title" style="margin:0;">Today's Devotion</h2>
        <button class="modal-close" data-close="daily-modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="daily-card" style="border:none;padding:0;">
        <blockquote id="daily-text"></blockquote>
        <cite id="daily-ref"></cite>
      </div>
    </div>
  </div>

  <!-- Reading plans modal -->
  <div class="modal-overlay" id="plans-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="section-title" style="margin:0;">Reading Plans</h2>
        <button class="modal-close" data-close="plans-modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="plans"></div>
    </div>
  </div>

</div>

<script type="module">
  import { renderBible } from "./js/components/bible.js";
  renderBible();
</script>
</body>
</html>
