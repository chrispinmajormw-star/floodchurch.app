<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
  // Apply saved theme/accent immediately, before first paint, to avoid a flash of the default theme.
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      var bg = t === "light" ? "#f5f6f8" : "#0a0a0c";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", bg);
    } catch (e) {}
  })();
</script>
<title>Bible — Flood Church</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar" id="topbar"></header>

  <div class="page">
    <h1 class="page-title">Bible</h1>

    <div class="search-bar" id="search-bar" style="cursor:text;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="verse-search-input" type="text" placeholder="Search a verse, e.g. John 3:16" style="background:none;border:none;color:var(--text);font-size:14px;flex:1;outline:none;">
    </div>

    <h2 class="section-title" style="margin-top:0;">Read the Bible</h2>
    <div class="card" style="margin-bottom:20px;">
      <div class="bible-picker">
        <select id="book-select" class="auth-input" style="flex:2;"></select>
        <select id="chapter-select" class="auth-input" style="flex:1;"></select>
      </div>
      <div id="reader-status" style="color:var(--text-dim);font-size:13.5px;margin:10px 0 0;"></div>
      <div id="reader-text" class="reader-text"></div>
      <div class="reader-nav">
        <button class="chip" id="prev-chapter">&larr; Prev</button>
        <span id="reader-location" style="color:var(--text-dim);font-size:13px;"></span>
        <button class="chip" id="next-chapter">Next &rarr;</button>
      </div>
    </div>

    <div class="daily-card">
      <div class="eyebrow">DAILY READING</div>
      <blockquote id="daily-text"></blockquote>
      <cite id="daily-ref"></cite>
      <div class="chip-row">
        <button class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/></svg>
          Highlight
        </button>
        <button class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          Note
        </button>
        <button class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
          Save
        </button>
      </div>
    </div>

    <h2 class="section-title">Reading Plans</h2>
    <div id="plans"></div>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<script type="module">
  import { renderBible } from "./js/components/bible.js";
  renderBible();
</script>
</body>
</html>
