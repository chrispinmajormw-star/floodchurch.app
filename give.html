<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // Apply saved theme/accent immediately, before first paint, to avoid a flash of the default theme.
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
    } catch (e) {}
  })();
</script>
<title>Give — Flood Church</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar" id="topbar"></header>

  <div class="page">
    <h1 class="page-title">Give</h1>
    <p class="verse-quote" id="give-verse"></p>

    <h2 class="section-title" style="margin-top:0;">Choose a fund</h2>
    <div class="fund-grid" id="fund-grid"></div>

    <h2 class="section-title">Amount (MWK)</h2>
    <div class="amount-row" id="amount-row"></div>
    <input class="amount-input" id="amount-input" type="number" inputmode="numeric">

    <h2 class="section-title" style="margin-top:0;">Payment method</h2>
    <div id="pay-methods"></div>

    <button class="btn btn-primary give-submit" id="give-submit">Give</button>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<script type="module">
  import { renderGive } from "./js/components/give.js";
  renderGive();
</script>
</body>
</html>
