<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // Apply saved theme/accent immediately, before first paint, to avoid a flash of the default theme.
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
    } catch (e) {}
  })();
</script>
<title>Edit Profile — Flood Church</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar" id="topbar"></header>

  <div class="page">
    <h1 class="page-title">Edit profile</h1>

    <div class="auth-error" id="profile-error"></div>
    <div class="auth-error" id="profile-success" style="color:#8fd19e;background:rgba(80,200,120,0.1);border-color:rgba(80,200,120,0.4);"></div>

    <form id="profile-form">
      <div class="auth-field">
        <label for="name">Full name</label>
        <input class="auth-input" type="text" id="name" required>
      </div>
      <div class="auth-field">
        <label for="group">Kingdom Culture group</label>
        <input class="auth-input" type="text" id="group" placeholder="e.g. Kingdom Culture">
      </div>
      <div class="auth-field">
        <label for="team">Team</label>
        <input class="auth-input" type="text" id="team" placeholder="e.g. Media Team">
      </div>
      <button class="btn btn-primary auth-submit" type="submit" id="profile-submit">Save changes</button>
    </form>

    <h2 class="section-title">Change password</h2>
    <div class="auth-error" id="password-error"></div>
    <div class="auth-error" id="password-success" style="color:#8fd19e;background:rgba(80,200,120,0.1);border-color:rgba(80,200,120,0.4);"></div>

    <form id="password-form">
      <div class="auth-field">
        <label for="new-password">New password</label>
        <input class="auth-input" type="password" id="new-password" minlength="6" required autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label for="confirm-password">Confirm new password</label>
        <input class="auth-input" type="password" id="confirm-password" minlength="6" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary auth-submit" type="submit" id="password-submit">Update password</button>
    </form>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<script type="module">
  import { renderEditProfile } from "./js/components/edit-profile.js";
  renderEditProfile();
</script>
</body>
</html>
