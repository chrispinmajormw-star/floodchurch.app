<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
  // Apply saved theme/accent immediately, before first paint, to avoid a flash of the default theme.
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      var bg = t === "light" ? "#f5f6f8" : "#0a0a0c";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", bg);
    } catch (e) {}
  })();
</script>
<title>Profile — Flood Church</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flood Church">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar" id="topbar"></header>

  <div class="page">
    <div class="profile-head">
      <div class="avatar" id="avatar"></div>
      <div>
        <h2 id="profile-name"></h2>
        <p class="member-id" id="member-id"></p>
        <p class="tag-line" id="tag-line"></p>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><b id="stat-given"></b><span>Given</span></div>
      <div class="stat"><b id="stat-saved"></b><span>Saved</span></div>
      <div class="stat"><b id="stat-plans"></b><span>Plans</span></div>
    </div>

    <div id="profile-list"></div>

    <h2 class="section-title">Serve in the Church</h2>
    <div id="ministry-grid"></div>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<script type="module">
  import { renderProfile } from "./js/components/profile.js";
  renderProfile();
</script>
</body>
</html>
