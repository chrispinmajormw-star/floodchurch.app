<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
  (function () {
    try {
      var t = localStorage.getItem("flood-theme") || "dark";
      var a = localStorage.getItem("flood-accent") || "#3b82f6";
      var bg = t === "light" ? "#f5f6f8" : "#0a0a0c";
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.setProperty("--blue", a);
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", bg);
    } catch (e) {}
  })();
</script>
<title>Events — Flood Church</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flood Church">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar" id="topbar"></header>

  <div class="page">
    <h1 class="page-title">Events</h1>
    <p class="page-sub">Everything coming up at Flood Church.</p>

    <h2 class="section-title" style="margin-top:0;">Upcoming</h2>
    <div id="upcoming-events"></div>
    <p id="upcoming-empty" style="display:none; color:var(--text-dim); font-size:14px;">No upcoming events right now.</p>

    <h2 class="section-title">Past</h2>
    <div id="past-events"></div>
    <p id="past-empty" style="display:none; color:var(--text-dim); font-size:14px;">Nothing here yet.</p>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>

  <!-- Event detail modal -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="section-title" style="margin:0;" id="event-modal-title">Event</h2>
        <button class="modal-close" data-close="event-modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p id="event-modal-when" style="color:var(--blue); font-weight:700; font-size:14.5px; margin:0 0 4px;"></p>
      <p id="event-modal-location" style="color:var(--text-dim); font-size:13.5px; margin:0 0 16px;"></p>
      <p id="event-modal-description" style="color:var(--text); font-size:14.5px; line-height:1.7; margin:0;"></p>
    </div>
  </div>

</div>

<script type="module">
  import { renderEvents } from "./js/components/events.js";
  renderEvents();
</script>
</body>
</html>
